<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vsedi</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f5f7fb;
      }

      .splash {
        display: grid;
        justify-items: center;
        gap: 18px;
        width: 100%;
        padding: 32px;
        color: #11182d;
        text-align: center;
      }

      .icon {
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        border-radius: 24px;
        background: #11182d;
        box-shadow: 0 16px 32px rgb(17 24 45 / 20%);
      }

      .icon svg {
        width: 54px;
        height: 54px;
      }

      .name {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Vsedi を起動しています">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 16L28 48L36 30L44 48L50 16" stroke="#9EE7E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="14" cy="16" r="4" fill="#FFFFFF" />
          <circle cx="50" cy="16" r="4" fill="#FFFFFF" />
        </svg>
      </div>
      <h1 class="name">Vsedi</h1>
    </main>
  </body>
</html>
