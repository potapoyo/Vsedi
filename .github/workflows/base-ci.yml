name: CI — 基本チェック

# Slint migration: automatic checks are paused until the new build/test path
# is restored in a later commit. Keep this manually runnable for diagnostics.
on:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend — typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust — tests / generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo run --manifest-path src-tauri/Cargo.toml --bin export_types
      - run: git diff --exit-code -- src/generated/bindings.ts
