name: UI Test

on:
  workflow_dispatch:
    inputs:
      test-case:
        description: 'テストケース名 (全テストの場合は空)'
        required: false
        default: ''

jobs:
  ui-test:
    name: ${{ matrix.os }} / Chromium
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      UI_TEST_CASE: ${{ inputs.test-case }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run UI tests
        run: pnpm test:ui

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
